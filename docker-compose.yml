services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iotmonitor-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DevContainer_Sql_123!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./seed/sql/entrypoint.sh:/usr/local/bin/entrypoint.sh
    entrypoint: /bin/bash /usr/local/bin/entrypoint.sh
    networks:
      - iotmonitor-network

  nodered:
    image: nodered/node-red:3.1.10
    container_name: iotmonitor-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
      - "5001:5001"
      - "5002:5002/udp"
    volumes:
      - nodered-data:/data
    environment:
      TZ: "UTC"
    networks:
      - iotmonitor-network

volumes:
  mssql-data:
  nodered-data:

networks:
  iotmonitor-network:
    driver: bridge