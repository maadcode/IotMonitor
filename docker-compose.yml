services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iotmonitor-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DevContainer_Sql_123!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./seed/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-DevContainer_Sql_123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nodered:
    image: nodered/node-red:3.1.10
    container_name: iotmonitor-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
      - "1502:1502"
      - "9999:9999/udp"
    volumes:
      - nodered-data:/data
      - ./seed/node-red/flows.json:/data/flows.json:ro
    environment:
      TZ: "UTC"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1880/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  iotmonitor-console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        APP_PROJECT: src/IotMonitor.ConsoleApp/IotMonitor.ConsoleApp.csproj
    depends_on:
      sqlserver:
        condition: service_healthy
      nodered:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IotMonitor;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DevContainer_Sql_123!};TrustServerCertificate=True
    stdin_open: true
    tty: true

volumes:
  mssql-data:
  nodered-data: